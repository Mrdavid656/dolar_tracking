name: Daily email

# Sends the summary of the latest reading to every subscriber, once a day.
# GitHub's scheduler sometimes never starts this run, so a computer may start it
# too (scripts/email_backup.ps1). A marker kept per day makes whichever run comes
# second send nothing. Test runs (check_only, only_to) ignore the marker.

on:
  schedule:
    - cron: "7 12 * * *" # 08:07 Bolivia time (UTC-4)
  workflow_dispatch:
    inputs:
      check_only:
        description: Only report who would receive the email; send nothing
        type: boolean
        default: false
      only_to:
        description: Send only to this address, ignoring the subscribers (for testing)
        type: string
        default: ""

permissions:
  contents: read

# One at a time, so two runs can never both find the day's marker missing.
concurrency: email

env:
  REAL_SEND: ${{ !inputs.check_only && inputs.only_to == '' }}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Day in Bolivia
        id: day
        run: echo "date=$(TZ=America/La_Paz date +%F)" >> "$GITHUB_OUTPUT"

      - name: Look for today's marker
        id: marker
        if: env.REAL_SEND == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .email-sent
          key: email-sent-${{ steps.day.outputs.date }}
          lookup-only: true

      - name: Send email
        if: steps.marker.outputs.cache-hit != 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SUBSCRIBERS_URL: ${{ secrets.SUBSCRIBERS_URL }}
          UNSUBSCRIBE_URL: ${{ vars.UNSUBSCRIBE_URL }}
          MAIL_ONLY_TO: ${{ inputs.only_to }}
          MAIL_LANG: ${{ vars.MAIL_LANG }}
        run: |
          export DASHBOARD_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          python -m dolar_market.mailer ${{ inputs.check_only && '--check' || '' }}

      - name: Write today's marker
        if: env.REAL_SEND == 'true' && steps.marker.outputs.cache-hit != 'true'
        run: date > .email-sent

      - name: Save today's marker
        if: env.REAL_SEND == 'true' && steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .email-sent
          key: email-sent-${{ steps.day.outputs.date }}
