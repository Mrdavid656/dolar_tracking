name: Daily email

# Sends the summary of the latest reading to every subscriber.

on:
  schedule:
    - cron: "0 12 * * *" # 08:00 Bolivia time (UTC-4)
  workflow_dispatch:
    inputs:
      check_only:
        description: Only report who would receive the email; send nothing
        type: boolean
        default: false
      only_to:
        description: Send only to this address, ignoring the subscribers (for testing)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SUBSCRIBERS_URL: ${{ secrets.SUBSCRIBERS_URL }}
          UNSUBSCRIBE_URL: ${{ vars.UNSUBSCRIBE_URL }}
          MAIL_ONLY_TO: ${{ inputs.only_to }}
          MAIL_LANG: ${{ vars.MAIL_LANG }}
        run: |
          export DASHBOARD_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          python -m dolar_market.mailer ${{ inputs.check_only && '--check' || '' }}
