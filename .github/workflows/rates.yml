name: Rates

# Takes a reading three times a day, then rebuilds and publishes the dashboard.
# A push that changes the data or the code (for example a backfill from a local
# machine) skips the reading and only republishes the dashboard.

on:
  schedule:
    - cron: "0 11 * * *" # 07:00 Bolivia time (UTC-4)
    - cron: "0 17 * * *" # 13:00 Bolivia time
    - cron: "0 23 * * *" # 19:00 Bolivia time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/rates.csv
      - dolar_market/**

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency: rates

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Query banks
        if: github.event_name != 'push'
        run: python -m dolar_market.scrape

      - name: Save dataset
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.csv
          git diff --cached --quiet && exit 0
          git commit -m "Rates $(TZ=America/La_Paz date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push

      # Opens an issue for every source missing from the last three readings and
      # closes the issues of sources that answer again.
      - name: Report failing sources
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m dolar_market.monitor > failing.txt
          gh label create source-down --color B60205 --description "A source stopped answering" --force
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            title="Source failing: $name"
            existing=$(gh issue list --label source-down --state open --json title --jq ".[] | select(.title == \"$title\") | .title")
            [ -n "$existing" ] && continue
            gh issue create --title "$title" --label source-down \
              --body "\`$name\` is missing from the last three readings. Its site may have changed or may be blocking GitHub's servers. See the Rates workflow logs, fix its entry in \`dolar_market/sources.py\` and refresh its fixture with \`python -m tests.capture_fixtures \"$name\"\`."
          done < failing.txt
          gh issue list --label source-down --state open --json number,title --jq '.[] | "\(.number)\t\(.title)"' |
            while IFS=$'\t' read -r number title; do
              grep -Fxq "${title#Source failing: }" failing.txt ||
                gh issue close "$number" --comment "The source is answering again."
            done

      - name: Build dashboard
        env:
          SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
        run: python -m dolar_market.dashboard

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
