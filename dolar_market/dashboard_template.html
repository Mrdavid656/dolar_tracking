<title>Pizarra del Dólar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: an exchange-house board. A header with the official rate, three key
   facts, and a table-chart where every bank is a row on the same Bs scale. */
:root {
  --bg: #f6f7f4;
  --surface: #fcfcfb;
  --ink: #0d1512;
  --ink-2: #4c5551;
  --muted: #858b86;
  --grid: #e1e3dc;
  --axis: #c2c6bd;
  --accent: #0f5c4a;
  --parallel: #4a3aa7;
  --buy: #2a78d6;
  --sell: #eb6834;
  --up: #0a8a0a;
  --down: #d03b3b;
  --display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f0e; --surface: #181a19; --ink: #f4f6f3; --ink-2: #c0c5bf; --muted: #898f89;
    --grid: #2a2d2b; --axis: #3a3e3b; --accent: #6fcfb4; --parallel: #a79df0; --buy: #3987e5; --sell: #d95926;
    --up: #0ca30c; --down: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f0e; --surface: #181a19; --ink: #f4f6f3; --ink-2: #c0c5bf; --muted: #898f89;
  --grid: #2a2d2b; --axis: #3a3e3b; --accent: #6fcfb4; --parallel: #a79df0; --buy: #3987e5; --sell: #d95926;
  --up: #0ca30c; --down: #e66767;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 20px; padding-block: 32px 48px; display: flex; flex-direction: column; gap: 36px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 32px; border-bottom: 2px solid var(--ink); padding-bottom: 16px; }
h1 { font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: clamp(34px, 7vw, 54px); line-height: 1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.subtitle { color: var(--ink-2); margin: 8px 0 0; }
.header-side { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.metrics { display: flex; gap: 28px; }
.metric { text-align: right; }
.label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.metric .num { display: block; font-size: 34px; font-weight: 500; line-height: 1.1; color: var(--accent); }
.metric.parallel .num { color: var(--parallel); }

.lang { display: inline-flex; border: 1px solid var(--axis); border-radius: 4px; overflow: hidden; }
.lang button { font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; padding: 4px 10px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.lang button + button { border-left: 1px solid var(--axis); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px 32px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { color: var(--ink-2); font-size: 14px; }
.facts dd { margin: 4px 0 0; }
.facts .num { font-size: 26px; font-weight: 500; }
.facts .winner { display: block; font-family: var(--display); font-stretch: 90%; font-weight: 700; font-size: 26px; line-height: 1.2; overflow-wrap: anywhere; }
.facts .who { display: block; color: var(--ink-2); font-size: 14px; }

h2 { font-family: var(--display); font-stretch: 85%; font-weight: 700; font-size: 22px; margin: 0; text-wrap: balance; }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.key.buy { background: var(--buy); } .key.sell { background: var(--sell); }
.key.official-line { width: 2px; height: 14px; border-radius: 0; background: var(--accent); }
.key.parallel-line { width: 0; height: 14px; border-radius: 0; border-left: 2px dashed var(--parallel); }

.panel { background: var(--surface); border: 1px solid var(--grid); border-radius: 6px; padding: 8px 16px 14px; position: relative; }
.row { display: grid; grid-template-columns: minmax(84px, 11rem) 3.4rem minmax(70px, 1fr) 3.4rem; align-items: center; column-gap: 12px; padding: 9px 0; border-top: 1px solid var(--grid); }
.row.columns { border-top: 0; padding: 6px 0; align-items: end; }
.row[tabindex]:hover, .row[tabindex]:focus-visible { background: color-mix(in srgb, var(--grid) 45%, transparent); outline: none; }
.row[tabindex]:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.bank { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.row .num { text-align: right; }
.row .num + .track + .num { text-align: left; }
.track { position: relative; height: 22px; }
.track i { position: absolute; top: 50%; display: block; }
.tick { top: 0 !important; bottom: 0; width: 1px; background: var(--grid); }
.official-mark { top: -9px !important; bottom: -9px; width: 2px; margin-left: -1px; background: var(--accent); opacity: 0.55; }
.parallel-mark { top: -9px !important; bottom: -9px; width: 0; margin-left: -1px; border-left: 2px dashed var(--parallel); opacity: 0.8; }
.bar { height: 4px; margin-top: -2px; background: var(--axis); border-radius: 2px; }
.dot { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }
.dot.buy { background: var(--buy); } .dot.sell { background: var(--sell); }
.columns .track { height: 16px; }
.columns .track span { position: absolute; bottom: 0; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: var(--muted); }
.change { display: block; font-size: 11px; color: var(--muted); }

.tooltip { position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 4px; padding: 8px 10px; font-size: 13px; line-height: 1.45; max-width: 240px; }
.tooltip b { display: block; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 4px; padding: 5px 8px; max-width: 100%; }
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#history { min-height: 120px; }
#history svg { display: block; width: 100%; height: auto; }
#history text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
#history text.end-label { font-family: var(--body); font-size: 12px; fill: var(--ink-2); }
.note { color: var(--ink-2); font-size: 13px; margin: 8px 0 0; max-width: 70ch; }
.empty { color: var(--ink-2); margin: 0; padding: 28px 0 20px; max-width: 60ch; }
footer a { color: var(--accent); }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--grid); padding-top: 14px; max-width: 70ch; }
</style>

<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="title"></h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="header-side">
      <div class="lang" role="group" id="lang-toggle">
        <button type="button" id="lang-es" data-lang="es">ES</button>
        <button type="button" id="lang-en" data-lang="en">EN</button>
      </div>
      <div class="metrics">
        <div class="metric">
          <span class="label" data-i18n="officialLabel"></span>
          <span class="num" id="official"></span>
        </div>
        <div class="metric parallel">
          <span class="label" data-i18n="parallelLabel"></span>
          <span class="num" id="parallel"></span>
        </div>
      </div>
    </div>
  </header>

  <section>
    <h2 data-i18n="bestDeal"></h2>
    <dl class="facts" id="facts"></dl>
  </section>

  <section>
    <div class="section-head">
      <h2 data-i18n="byBank"></h2>
      <div class="legend">
        <span><i class="key buy"></i><span data-i18n="legendBuy"></span></span>
        <span><i class="key sell"></i><span data-i18n="legendSell"></span></span>
        <span><i class="key official-line"></i><span data-i18n="officialLabel"></span></span>
        <span><i class="key parallel-line"></i><span data-i18n="parallelLabel"></span></span>
      </div>
    </div>
    <div class="panel" id="board"></div>
  </section>

  <section>
    <div class="section-head">
      <h2 data-i18n="history"></h2>
      <div class="controls">
        <label for="view-select" data-i18n="chart"></label>
        <select id="view-select">
          <option value="lines" data-i18n="viewLines"></option>
          <option value="day" data-i18n="viewDay"></option>
          <option value="week" data-i18n="viewWeek"></option>
        </select>
        <label for="bank-select" data-i18n="of"></label>
        <select id="bank-select"></select>
      </div>
    </div>
    <div class="panel" id="history"></div>
  </section>

  <footer><span id="footer-text"></span> <a id="subscribe-link" target="_blank" rel="noopener" hidden></a></footer>
</div>

<script>
const DATA = /*DATA*/;

/* ---------- translations: every string the viewer reads lives here ---------- */
const TEXTS = {
  es: {
    locale: "es-BO",
    title: "Pizarra del Dólar",
    subtitle: date => `Lectura del ${date} (hora de Bolivia), en bolivianos por dólar`,
    officialLabel: "Oficial BCB",
    parallelLabel: "Paralelo",
    languageLabel: "Idioma",
    bestDeal: "Mejor oferta de hoy",
    toBuy: "Para comprar dólares",
    toBuyDetail: price => `vende a Bs ${price}, la venta más baja`,
    toSell: "Para vender tus dólares",
    toSellDetail: price => `compra a Bs ${price}, la compra más alta`,
    averageGap: "Diferencia media entre venta y compra",
    acrossBanks: n => `en ${n} bancos`,
    byBank: "Compra y venta por banco",
    legendBuy: "Compra (el banco te paga)",
    legendSell: "Venta (el banco te cobra)",
    bank: "Banco", buy: "Compra", sell: "Venta", official: "Oficial",
    gap: "Diferencia",
    sellAboveOfficial: "Venta sobre el oficial",
    history: "Historial", chart: "Gráfico", of: "de",
    viewLines: "Líneas de compra y venta",
    viewDay: "Velas de venta por día",
    viewWeek: "Velas de venta por semana",
    bestOverall: "Mejor precio entre todos los bancos",
    oneReading: "Hay una sola lectura guardada. Las líneas y las velas aparecen desde la segunda; las lecturas se toman cada día a las 07:00, 13:00 y 19:00.",
    noBankData: "Este banco no tiene datos en las lecturas guardadas.",
    noSellData: "Este banco no publica precio de venta en las lecturas guardadas.",
    candleNote: weekly => `Cada vela resume la venta de ${weekly ? "una semana" : "un día"}: el cuerpo va de la primera a la última lectura (verde si subió, rojo si bajó, gris si no cambió) y la mecha marca el máximo y el mínimo. La línea continua es el oficial del BCB.`,
    open: "Apertura", high: "Máximo", low: "Mínimo", close: "Cierre",
    readingCount: n => `${n} ${n === 1 ? "lectura" : "lecturas"}`,
    weekOf: date => `Semana del ${date}`,
    linesAria: "Compra y venta del dólar a lo largo del tiempo",
    candlesAria: weekly => `Velas del precio de venta del dólar por ${weekly ? "semana" : "día"}`,
    footer: n => `${n} ${n === 1 ? "lectura guardada" : "lecturas guardadas"}, tomadas de los sitios públicos de cada banco. Ganadero solo publica un valor referencial de venta. El paralelo es el USDT en Binance P2P: punto medio entre compra y venta.`,
    subscribe: "Recibir el resumen diario por correo",
    missing: banks => ` Sin datos en la última lectura: ${banks}.`,
  },
  en: {
    locale: "en-GB",
    title: "Dollar Board",
    subtitle: date => `Reading from ${date} (Bolivia time), in bolivianos per dollar`,
    officialLabel: "BCB official",
    parallelLabel: "Parallel",
    languageLabel: "Language",
    bestDeal: "Best deal today",
    toBuy: "To buy dollars",
    toBuyDetail: price => `sells at Bs ${price}, the lowest sell`,
    toSell: "To sell your dollars",
    toSellDetail: price => `buys at Bs ${price}, the highest buy`,
    averageGap: "Average gap between sell and buy",
    acrossBanks: n => `across ${n} banks`,
    byBank: "Buy and sell by bank",
    legendBuy: "Buy (the bank pays you)",
    legendSell: "Sell (the bank charges you)",
    bank: "Bank", buy: "Buy", sell: "Sell", official: "Official",
    gap: "Gap",
    sellAboveOfficial: "Sell above official",
    history: "History", chart: "Chart", of: "for",
    viewLines: "Buy and sell lines",
    viewDay: "Daily sell candles",
    viewWeek: "Weekly sell candles",
    bestOverall: "Best price across all banks",
    oneReading: "Only one reading is saved. Lines and candles appear from the second one; readings are taken every day at 07:00, 13:00 and 19:00.",
    noBankData: "This bank has no data in the saved readings.",
    noSellData: "This bank does not publish a sell price in the saved readings.",
    candleNote: weekly => `Each candle summarises the sell price for ${weekly ? "one week" : "one day"}: the body runs from the first to the last reading (green if it rose, red if it fell, grey if unchanged) and the wick marks the high and the low. The solid line is the BCB official rate.`,
    open: "Open", high: "High", low: "Low", close: "Close",
    readingCount: n => `${n} ${n === 1 ? "reading" : "readings"}`,
    weekOf: date => `Week of ${date}`,
    linesAria: "Dollar buy and sell prices over time",
    candlesAria: weekly => `Dollar sell price candles by ${weekly ? "week" : "day"}`,
    footer: n => `${n} saved ${n === 1 ? "reading" : "readings"}, taken from each bank's public website. Ganadero only publishes a reference sell value. The parallel rate is USDT on Binance P2P: midpoint between buy and sell.`,
    subscribe: "Get the daily summary by email",
    missing: banks => ` No data in the latest reading: ${banks}.`,
  },
};

/* ---------- small helpers ---------- */
const byId = id => document.getElementById(id);
const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const readStored = key => { try { return localStorage.getItem(key); } catch (e) { return null; } };
const store = (key, value) => { try { localStorage.setItem(key, value); } catch (e) {} };

let lang = TEXTS[readStored("lang")] ? readStored("lang") : "es";
const text = () => TEXTS[lang];
const formatNumber = (value, digits = 2) =>
  value == null ? "—" : value.toLocaleString(text().locale, { minimumFractionDigits: digits, maximumFractionDigits: digits });
const BOLIVIA = "America/La_Paz";
const formatLongDate = iso => new Date(iso).toLocaleString(text().locale,
  { timeZone: BOLIVIA, day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
const formatShortDate = iso => new Date(iso).toLocaleDateString(text().locale, { timeZone: BOLIVIA, day: "2-digit", month: "2-digit" });
const formatShortDateTime = iso => new Date(iso).toLocaleString(text().locale,
  { timeZone: BOLIVIA, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
const dayToIso = day => `${day}T12:00:00-04:00`; // noon in Bolivia, safely inside that day

/* ---------- data derived once; none of it depends on the language ---------- */
const readings = DATA.readings;
const latest = readings[readings.length - 1], previous = readings[readings.length - 2];
const officialOf = reading => {
  const own = reading.banks.BCB;
  if (own && own.official != null) return own.official;
  const quote = Object.values(reading.banks).find(q => q.official != null);
  return quote ? quote.official : null;
};
const OFFICIAL_SOURCE = "BCB", PARALLEL_SOURCE = "Parallel";
const REFERENCE_SOURCES = [OFFICIAL_SOURCE, PARALLEL_SOURCE];
// The parallel-market rate: midpoint between its buy and sell prices.
const parallelOf = reading => {
  const quote = reading.banks[PARALLEL_SOURCE] || {};
  const present = [quote.buy, quote.sell].filter(v => v != null);
  return present.length ? present.reduce((a, b) => a + b, 0) / present.length : null;
};
const displayName = name => name === PARALLEL_SOURCE ? text().parallelLabel : name;
const pricedBanks = reading => Object.entries(reading.banks)
  .filter(([name, q]) => !REFERENCE_SOURCES.includes(name) && (q.buy != null || q.sell != null))
  .map(([name, q]) => ({ name, ...q }));

const official = officialOf(latest), parallel = parallelOf(latest);
const rows = pricedBanks(latest).sort((a, b) =>
  (a.sell == null) - (b.sell == null) || a.sell - b.sell || (b.buy ?? 0) - (a.buy ?? 0) || a.name.localeCompare(b.name));
const withSell = rows.filter(r => r.sell != null), withBuy = rows.filter(r => r.buy != null);
const minSell = Math.min(...withSell.map(r => r.sell)), maxBuy = Math.max(...withBuy.map(r => r.buy));
const namesWith = (list, key, value) => list.filter(r => r[key] === value).map(r => r.name).join(", ");
const gaps = rows.filter(r => r.buy != null && r.sell != null).map(r => r.sell - r.buy);
const averageGap = gaps.reduce((a, b) => a + b, 0) / (gaps.length || 1);

// shared horizontal scale of the by-bank chart
const allValues = rows.flatMap(r => [r.buy, r.sell]).concat(official, parallel).filter(v => v != null);
const scaleMin = Math.floor((Math.min(...allValues) - 0.1) * 2) / 2;
const scaleMax = Math.ceil((Math.max(...allValues) + 0.1) * 2) / 2;
const percent = v => ((v - scaleMin) / (scaleMax - scaleMin) * 100).toFixed(2) + "%";
const tickStep = scaleMax - scaleMin > 4 ? 1 : 0.5;
const ticks = [];
for (let t = scaleMin; t <= scaleMax + 1e-9; t += tickStep) ticks.push(t);

const BEST = "__best__";
const bankNames = [...new Set(readings.flatMap(r => pricedBanks(r).map(b => b.name)))].sort((a, b) => a.localeCompare(b));
const hasParallelHistory = readings.some(r => parallelOf(r) != null);
const historyKeys = hasParallelHistory ? [...bankNames, PARALLEL_SOURCE] : bankNames;
const missingSources = (DATA.sources || []).filter(name => !latest.banks[name]);

/* ---------- header, facts and by-bank chart ---------- */
function renderStaticText() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = text()[el.dataset.i18n]; });
  document.querySelectorAll("#lang-toggle button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  byId("lang-toggle").setAttribute("aria-label", text().languageLabel);
  byId("subtitle").textContent = text().subtitle(formatLongDate(latest.t));
  byId("official").textContent = formatNumber(official);
  byId("parallel").textContent = formatNumber(parallel);
  byId("footer-text").textContent = text().footer(readings.length) +
    (missingSources.length ? text().missing(missingSources.map(displayName).join(", ")) : "");
  const subscribeLink = byId("subscribe-link");
  subscribeLink.hidden = !DATA.subscribeUrl;
  if (DATA.subscribeUrl) { subscribeLink.href = DATA.subscribeUrl; subscribeLink.textContent = text().subscribe; }
}

// Best deal today: the lowest sell for buyers, the highest buy for sellers.
function renderFacts() {
  const deal = (label, winners, detail) => `<div><dt>${label}</dt>
    <dd><span class="winner">${escapeHtml(winners || "—")}</span><span class="who">${detail}</span></dd></div>`;
  byId("facts").innerHTML =
    deal(text().toBuy, namesWith(withSell, "sell", minSell), text().toBuyDetail(formatNumber(minSell))) +
    deal(text().toSell, namesWith(withBuy, "buy", maxBuy), text().toSellDetail(formatNumber(maxBuy))) +
    `<div><dt>${text().averageGap}</dt>
    <dd><span class="num">${formatNumber(averageGap)}</span><span class="who">${text().acrossBanks(gaps.length)}</span></dd></div>`;
}

function changeHtml(row, key) {
  const before = previous && previous.banks[row.name] ? previous.banks[row.name][key] : null;
  if (before == null || row[key] == null || before === row[key]) return "";
  return `<span class="change">${row[key] > before ? "▲" : "▼"} ${formatNumber(Math.abs(row[key] - before))}</span>`;
}

function renderBoard() {
  const gridLines = ticks.map(t => `<i class="tick" style="left:${percent(t)}"></i>`).join("");
  const header = `<div class="row columns">
    <span class="label">${text().bank}</span><span class="label num">${text().buy}</span>
    <div class="track">${ticks.slice(1, -1).map(t => `<span style="left:${percent(t)}">${formatNumber(t, 1)}</span>`).join("")}</div>
    <span class="label num">${text().sell}</span>
  </div>`;
  byId("board").innerHTML = header + rows.map((r, i) => `
  <div class="row" tabindex="0" data-index="${i}">
    <span class="bank">${escapeHtml(r.name)}</span>
    <span class="num">${formatNumber(r.buy)}${changeHtml(r, "buy")}</span>
    <div class="track">${gridLines}
      ${official != null ? `<i class="official-mark" style="left:${percent(official)}"></i>` : ""}
      ${parallel != null ? `<i class="parallel-mark" style="left:${percent(parallel)}"></i>` : ""}
      ${r.buy != null && r.sell != null ? `<i class="bar" style="left:${percent(r.buy)};width:${((r.sell - r.buy) / (scaleMax - scaleMin) * 100).toFixed(2)}%"></i>` : ""}
      ${r.buy != null ? `<i class="dot buy" style="left:${percent(r.buy)}"></i>` : ""}
      ${r.sell != null ? `<i class="dot sell" style="left:${percent(r.sell)}"></i>` : ""}
    </div>
    <span class="num">${formatNumber(r.sell)}${changeHtml(r, "sell")}</span>
  </div>`).join("");
}

/* ---------- tooltip shared by both charts ---------- */
const tooltip = document.createElement("div");
tooltip.className = "tooltip"; tooltip.hidden = true;
function showTooltip(container, html, x, y) {
  if (tooltip.parentNode !== container) container.appendChild(tooltip);
  tooltip.innerHTML = html; tooltip.hidden = false;
  const maxLeft = container.clientWidth - tooltip.offsetWidth - 4;
  tooltip.style.left = Math.max(4, Math.min(x + 12, maxLeft)) + "px";
  tooltip.style.top = (y + 14) + "px";
}
const hideTooltip = () => { tooltip.hidden = true; };

const board = byId("board");
function showRowTooltip(rowElement, x, y) {
  const r = rows[+rowElement.dataset.index];
  const gap = r.buy != null && r.sell != null ? `<br>${text().gap}: ${formatNumber(r.sell - r.buy)}` : "";
  const overOfficial = r.sell != null && official != null ? `<br>${text().sellAboveOfficial}: ${formatNumber(r.sell - official)}` : "";
  showTooltip(board, `<b>${escapeHtml(r.name)}</b>${text().buy} ${formatNumber(r.buy)} · ${text().sell} ${formatNumber(r.sell)}${gap}${overOfficial}`, x, y);
}
board.addEventListener("mousemove", e => {
  const rowElement = e.target.closest(".row[tabindex]");
  if (!rowElement) { hideTooltip(); return; }
  const box = board.getBoundingClientRect();
  showRowTooltip(rowElement, e.clientX - box.left, e.clientY - box.top);
});
board.addEventListener("mouseleave", hideTooltip);
board.addEventListener("focusin", e => {
  const rowElement = e.target.closest(".row[tabindex]");
  if (rowElement) showRowTooltip(rowElement, rowElement.offsetLeft + 80, rowElement.offsetTop + rowElement.offsetHeight - 14);
});
board.addEventListener("focusout", hideTooltip);

/* ---------- history ---------- */
const bankSelect = byId("bank-select"), viewSelect = byId("view-select"), historyPanel = byId("history");

function renderBankOptions() {
  const selected = bankSelect.value || readStored("bank") || BEST;
  bankSelect.innerHTML = `<option value="${BEST}">${text().bestOverall}</option>` +
    historyKeys.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(displayName(n))}</option>`).join("");
  bankSelect.value = [BEST, ...historyKeys].includes(selected) ? selected : BEST;
}

// One point per reading for the chosen bank, or the best price across all banks.
function seriesFor(key) {
  return readings.map(reading => {
    let buy = null, sell = null;
    if (key === BEST) {
      const banks = pricedBanks(reading);
      const buys = banks.map(b => b.buy).filter(v => v != null), sells = banks.map(b => b.sell).filter(v => v != null);
      buy = buys.length ? Math.max(...buys) : null; sell = sells.length ? Math.min(...sells) : null;
    } else if (reading.banks[key]) { buy = reading.banks[key].buy; sell = reading.banks[key].sell; }
    return { t: reading.t, ms: Date.parse(reading.t), buy, sell, official: officialOf(reading), parallel: parallelOf(reading) };
  });
}

// Groups sell readings into candles: open, high, low and close per day or per week.
function toCandles(points, weekly) {
  const groups = new Map();
  points.filter(p => p.sell != null).forEach(p => {
    let key = p.t.slice(0, 10);
    if (weekly) {
      const date = new Date(key + "T00:00:00Z");
      date.setUTCDate(date.getUTCDate() - (date.getUTCDay() + 6) % 7); // Monday of that week
      key = date.toISOString().slice(0, 10);
    }
    const candle = groups.get(key) || { key, open: p.sell, high: p.sell, low: p.sell, count: 0 };
    candle.high = Math.max(candle.high, p.sell); candle.low = Math.min(candle.low, p.sell);
    candle.close = p.sell; candle.official = p.official; candle.count++;
    groups.set(key, candle);
  });
  return [...groups.values()];
}

const CHART_HEIGHT = 260;
const chartWidth = () => Math.max(300, historyPanel.clientWidth - 32);

// Picks a "nice" vertical domain and returns it with its grid step.
function yDomain(values) {
  const low = Math.min(...values), high = Math.max(...values);
  const step = [0.05, 0.1, 0.2, 0.25, 0.5, 1, 2].find(s => (high - low + 0.1) / s <= 5) || 5;
  return { min: Math.floor((low - 0.02) / step) * step, max: Math.ceil((high + 0.02) / step) * step, step };
}

function yGridSvg(domain, y, left, right) {
  let svg = "";
  for (let v = domain.min; v <= domain.max + 1e-9; v += domain.step) {
    svg += `<line x1="${left}" x2="${right}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${left - 8}" y="${y(v) + 4}" text-anchor="end">${formatNumber(v)}</text>`;
  }
  return svg;
}

function drawCandles(points, weekly) {
  const candles = toCandles(points, weekly);
  if (!candles.length) { historyPanel.innerHTML = `<p class="empty">${text().noSellData}</p>`; return; }
  const width = chartWidth(), height = CHART_HEIGHT;
  const margin = { top: 16, right: 16, bottom: 28, left: 44 };
  const domain = yDomain(candles.flatMap(c => [c.high, c.low, c.official]).filter(v => v != null));
  const band = (width - margin.left - margin.right) / candles.length, bodyWidth = Math.max(3, Math.min(22, band * 0.6));
  const x = i => margin.left + band * (i + 0.5);
  const y = v => margin.top + (domain.max - v) / (domain.max - domain.min || 1) * (height - margin.top - margin.bottom);
  const labelEvery = Math.max(1, Math.ceil(48 / band));
  let marks = yGridSvg(domain, y, margin.left, width - margin.right);
  candles.forEach((c, i) => {
    if (i % labelEvery === 0) marks += `<text x="${x(i)}" y="${height - 8}" text-anchor="middle">${formatShortDate(dayToIso(c.key))}</text>`;
    const color = c.close > c.open ? "var(--up)" : c.close < c.open ? "var(--down)" : "var(--muted)";
    const flat = c.close === c.open;
    const top = flat ? y(c.open) - 1 : y(Math.max(c.open, c.close));
    const bodyHeight = flat ? 2 : Math.max(2, y(Math.min(c.open, c.close)) - top);
    marks += `<line x1="${x(i)}" x2="${x(i)}" y1="${y(c.high)}" y2="${y(c.low)}" stroke="${color}" stroke-width="1.5"/>
      <rect x="${x(i) - bodyWidth / 2}" y="${top}" width="${bodyWidth}" height="${bodyHeight}" rx="1" fill="${color}"/>`;
  });
  const officialPoints = candles.map((c, i) => c.official == null ? "" : `${x(i).toFixed(1)},${y(c.official).toFixed(1)}`).filter(Boolean);
  historyPanel.innerHTML = `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img"
      aria-label="${text().candlesAria(weekly)}">${marks}
    ${officialPoints.length > 1 ? `<polyline points="${officialPoints.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0.7"/>` : ""}
    <line id="crosshair" y1="${margin.top}" y2="${height - margin.bottom}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>
  </svg>
  <p class="note">${text().candleNote(weekly)}</p>`;
  const svg = historyPanel.querySelector("svg"), crosshair = historyPanel.querySelector("#crosshair");
  svg.addEventListener("mousemove", e => {
    const box = svg.getBoundingClientRect(), mouseX = (e.clientX - box.left) * (width / box.width);
    const i = Math.max(0, Math.min(candles.length - 1, Math.floor((mouseX - margin.left) / band))), c = candles[i];
    crosshair.setAttribute("x1", x(i)); crosshair.setAttribute("x2", x(i)); crosshair.setAttribute("visibility", "visible");
    const panel = historyPanel.getBoundingClientRect(), day = formatShortDate(dayToIso(c.key));
    showTooltip(historyPanel, `<b>${weekly ? text().weekOf(day) : day}</b>${text().open} ${formatNumber(c.open)}<br>${text().high} ${formatNumber(c.high)}<br>${text().low} ${formatNumber(c.low)}<br>${text().close} ${formatNumber(c.close)}<br>${text().readingCount(c.count)}`,
      e.clientX - panel.left, e.clientY - panel.top);
  });
  svg.addEventListener("mouseleave", () => { crosshair.setAttribute("visibility", "hidden"); hideTooltip(); });
}

function drawLines(points) {
  const values = points.flatMap(p => [p.buy, p.sell, p.official, p.parallel]).filter(v => v != null);
  if (!values.length) { historyPanel.innerHTML = `<p class="empty">${text().noBankData}</p>`; return; }
  const width = chartWidth(), height = CHART_HEIGHT;
  const margin = { top: 16, right: 96, bottom: 28, left: 44 };
  const domain = yDomain(values);
  const firstMs = points[0].ms, lastMs = points[points.length - 1].ms;
  const x = ms => margin.left + (ms - firstMs) / (lastMs - firstMs || 1) * (width - margin.left - margin.right);
  const y = v => margin.top + (domain.max - v) / (domain.max - domain.min || 1) * (height - margin.top - margin.bottom);
  const path = key => points.filter(p => p[key] != null).map((p, i) => `${i ? "L" : "M"}${x(p.ms).toFixed(1)},${y(p[key]).toFixed(1)}`).join("");
  let marks = yGridSvg(domain, y, margin.left, width - margin.right);
  const spansFewDays = lastMs - firstMs < 3 * 24 * 3600 * 1000; // then the time of day matters
  const labelCount = Math.min(points.length, Math.max(2, Math.floor((width - margin.left - margin.right) / (spansFewDays ? 130 : 90))));
  for (let i = 0; i < labelCount; i++) {
    const p = points[Math.round(i * (points.length - 1) / (labelCount - 1))];
    const anchor = i === 0 ? "start" : i === labelCount - 1 ? "end" : "middle";
    marks += `<text x="${x(p.ms)}" y="${height - 8}" text-anchor="${anchor}">${spansFewDays ? formatShortDateTime(p.t) : formatShortDate(p.t)}</text>`;
  }
  const lastWith = key => [...points].reverse().find(p => p[key] != null);
  const series = [["sell", text().sell, "var(--sell)"], ["buy", text().buy, "var(--buy)"]]
    .map(([key, name, color]) => ({ key, name, color, point: lastWith(key) })).filter(s => s.point);
  // nudge the end labels apart when they would overlap
  series.forEach(s => { s.labelY = y(s.point[s.key]); });
  if (series.length === 2 && Math.abs(series[0].labelY - series[1].labelY) < 14) {
    const middle = (series[0].labelY + series[1].labelY) / 2;
    const upper = series[0].labelY <= series[1].labelY ? 0 : 1;
    series[upper].labelY = middle - 7; series[1 - upper].labelY = middle + 7;
  }
  historyPanel.innerHTML = `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img"
      aria-label="${text().linesAria}">${marks}
    <path d="${path("official")}" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0.7"/>
    <path d="${path("parallel")}" fill="none" stroke="var(--parallel)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.9"/>
    ${series.map(s => `<path d="${path(s.key)}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(s.point.ms)}" cy="${y(s.point[s.key])}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>
      <text class="end-label" x="${width - margin.right + 10}" y="${s.labelY + 4}">${s.name} ${formatNumber(s.point[s.key])}</text>`).join("")}
    <line id="crosshair" y1="${margin.top}" y2="${height - margin.bottom}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>
  </svg>`;
  const svg = historyPanel.querySelector("svg"), crosshair = historyPanel.querySelector("#crosshair");
  svg.addEventListener("mousemove", e => {
    const box = svg.getBoundingClientRect(), mouseX = (e.clientX - box.left) * (width / box.width);
    const p = points.reduce((a, b) => Math.abs(x(b.ms) - mouseX) < Math.abs(x(a.ms) - mouseX) ? b : a);
    crosshair.setAttribute("x1", x(p.ms)); crosshair.setAttribute("x2", x(p.ms)); crosshair.setAttribute("visibility", "visible");
    const panel = historyPanel.getBoundingClientRect();
    showTooltip(historyPanel, `<b>${formatShortDateTime(p.t)}</b>${text().sell} ${formatNumber(p.sell)}<br>${text().buy} ${formatNumber(p.buy)}<br>${text().official} ${formatNumber(p.official)}<br>${text().parallelLabel} ${formatNumber(p.parallel)}`,
      e.clientX - panel.left, e.clientY - panel.top);
  });
  svg.addEventListener("mouseleave", () => { crosshair.setAttribute("visibility", "hidden"); hideTooltip(); });
}

function drawHistory() {
  if (readings.length < 2) { historyPanel.innerHTML = `<p class="empty">${text().oneReading}</p>`; return; }
  const points = seriesFor(bankSelect.value);
  if (viewSelect.value === "lines") drawLines(points);
  else drawCandles(points, viewSelect.value === "week");
}

/* ---------- wiring ---------- */
function render() {
  renderStaticText();
  renderFacts();
  renderBoard();
  renderBankOptions();
  drawHistory();
}

const storedView = readStored("view");
if (["lines", "day", "week"].includes(storedView)) viewSelect.value = storedView;

byId("lang-toggle").addEventListener("click", e => {
  const button = e.target.closest("button[data-lang]");
  if (!button || button.dataset.lang === lang) return;
  lang = button.dataset.lang;
  store("lang", lang);
  render();
});
bankSelect.addEventListener("change", () => { store("bank", bankSelect.value); drawHistory(); });
viewSelect.addEventListener("change", () => { store("view", viewSelect.value); drawHistory(); });
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawHistory, 150); });

render();
</script>
